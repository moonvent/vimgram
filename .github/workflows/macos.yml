name: macOS

# Separate from CI while macOS support is new: no tray, autostart or
# packaging yet, only that it builds and its tests pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Homebrew packages
        id: brew
        run: |
          brew install gstreamer pkgconf cmake ninja
          echo "gstreamer=$(brew list --versions gstreamer | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      # The gstreamer crates' build scripts link against the Cellar path of
      # the version they saw, and a cached build doesn't run them again: a
      # new gstreamer (1.28.8 → 1.28.8_1) needs a new cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.brew.outputs.gstreamer }}
      - name: TDLib
        run: ./scripts/fetch-tdlib.sh
      # rlottie-sys's own build of rlottie fails to link on macOS; it takes
      # this one through pkg-config.
      - name: rlottie
        run: |
          ./scripts/build-rlottie.sh
          echo "PKG_CONFIG_PATH=$PWD/vendor/rlottie:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - run: cargo build --release --locked
      - run: cargo test --release --locked
