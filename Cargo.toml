[package]
name = "vimgram"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6"
flate2 = "1.1.10"
futures = { version = "0.3.34", features = ["executor"] }
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
iced = { version = "0.14", features = ["tokio", "image"] }
iced_video_player = "0.6"
notify-rust = "4.18.2"
printpdf = "0.12.8"
rfd = "0.17.2"
rlottie = "0.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tdlib-rs = { version = "1.4", features = ["local-tdlib"] }
tokio = { version = "1", features = ["rt", "time"] }
toml = "1.1.8"
url = "2.5.8"
