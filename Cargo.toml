[package]
name = "vimgram"
version = "1.0.41"
edition = "2024"
description = "Keyboard-only, Vim-style Telegram client"
license = "MIT"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6"
emojis = "0.9.0"
flate2 = "1.1.10"
futures = { version = "0.3.34", features = ["executor"] }
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-pbutils = "0.23"
gstreamer-video = "0.23"
iced = { version = "0.14", features = ["tokio", "image", "advanced", "canvas"] }
iced_video_player = "0.6"
image = "0.25"
notify-rust = "4.18.2"
printpdf = "0.12.8"
rfd = "0.17.2"
rlottie-sys = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tdlib-rs = { version = "1.4", features = ["local-tdlib"] }
tiny-skia = "0.11.4"
tokio = { version = "1", features = ["rt", "time"] }
toml = "1.1.8"
url = "2.5.8"

# Tray icon and closing notifications go through D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
zbus = { version = "5.19", default-features = false }

# Images and copied files on the clipboard.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
arboard = "3"

[profile.release]
incremental = true
codegen-units = 256
